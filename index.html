<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>On click practice</title>
    
    <style>
        #header {
            text-align: center;
        }

        #button-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            font-size: 16px;
            border-radius: 5px;
            margin: 5px;
        }

        #yes-button {
            background-color: #4CAF50;
            color: white;
            border: 2px solid #000;
            padding: 10px 20px;
        }

        #no-button {
            background-color: #f44336;
            color: white;
            border: 2px solid #000;
            padding: 10px 20px;
        }

        #message-container {
            text-align: center;
            margin-top: 20px;
        }

        #message {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

    </style>
</head>

<body>
    <h1 id="header"> Do you love me?</h1>

    <div id="button-container">
        <button id="yes-button" onclick="response('green', 'Yay! I love you too, Mahal ko!')">Yes! I love you so much!</button>
        <button id="no-button" onclick="response('red', 'Oh no... Why not!')">No! I don't love you!</button>
    </div>

    <div id="message-container">
        <p id="message"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
